# Qillqa — despliegue completo con Docker Compose (demo y uso real).
# Qillqa es el anfitrión de una plataforma de módulos que viven en sus propios repositorios (Tiqsi, el contrato; Qillqasqa,
# con el marco documental y la edición simultánea; la Mediateca, Tareas y Agenda, el chat, la Mesa de Partes…). Se
# clonan JUNTO a este (la misma carpeta madre; PLATAFORMA_DIR la cambia) y cada imagen los trae por `additional_contexts`
# (Docker Compose 2.17 o más nuevo): ver «Probar la demo» en el README.
#   cp .env.example .env            cambiar las claves
#   docker compose up -d --build    base de datos, API con LuaLaTeX y web (con el servidor de edición simultánea)
#   docker compose run --rm siembra datos ficticios de demostración (idempotente; no usar con datos reales)
# Web: http://localhost:${QILLQA_PUERTO_WEB:-5173}. La base de datos no se publica fuera de Docker.
name: qillqa

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qillqa}
      POSTGRES_USER: ${POSTGRES_USER:-qillqa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qillqa} -d ${POSTGRES_DB:-qillqa}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./backend
      additional_contexts:
        tiqsi: ${PLATAFORMA_DIR:-..}/tiqsi
        rikchay: ${PLATAFORMA_DIR:-..}/rikchay
        wayra: ${PLATAFORMA_DIR:-..}/wayra
        ruray: ${PLATAFORMA_DIR:-..}/ruray
        tullpu: ${PLATAFORMA_DIR:-..}/tullpu
        kuyuy: ${PLATAFORMA_DIR:-..}/kuyuy
        awana: ${PLATAFORMA_DIR:-..}/awana
        qhawana: ${PLATAFORMA_DIR:-..}/qhawana
        yupay: ${PLATAFORMA_DIR:-..}/yupay
        minka: ${PLATAFORMA_DIR:-..}/minka
        rimay: ${PLATAFORMA_DIR:-..}/rimay
        punku: ${PLATAFORMA_DIR:-..}/punku
        qillqasqa: ${PLATAFORMA_DIR:-..}/qillqasqa
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-qillqa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-qillqa}
      MDD_RUTA: /plataforma/qillqasqa/marco_documental     # el marco viaja con Qillqasqa (dentro de la imagen)
      MDD_DOCUMENTOS: /datos/documentos
      MDD_PERFIL: ${MDD_PERFIL_CONTENEDOR:-}
    volumes:
      - datos:/datos
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${QILLQA_PUERTO_API:-8000}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      additional_contexts:
        tiqsi: ${PLATAFORMA_DIR:-..}/tiqsi
        rikchay: ${PLATAFORMA_DIR:-..}/rikchay
        wayra: ${PLATAFORMA_DIR:-..}/wayra
        tullpu: ${PLATAFORMA_DIR:-..}/tullpu
        kuyuy: ${PLATAFORMA_DIR:-..}/kuyuy
        awana: ${PLATAFORMA_DIR:-..}/awana
        qhawana: ${PLATAFORMA_DIR:-..}/qhawana
        yupay: ${PLATAFORMA_DIR:-..}/yupay
        minka: ${PLATAFORMA_DIR:-..}/minka
        rimay: ${PLATAFORMA_DIR:-..}/rimay
        punku: ${PLATAFORMA_DIR:-..}/punku
        qillqasqa: ${PLATAFORMA_DIR:-..}/qillqasqa
    environment:
      VITE_NOMBRE_DESPACHO: ${VITE_NOMBRE_DESPACHO:-Entidad de demostración}
      VITE_API_PROXY: http://api:8000
      VITE_COLAB_PROXY: ws://127.0.0.1:8001
      QILLQA_API: http://api:8000
      COLAB_PUERTO: "8001"
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}   # el servidor de colab firma con él las salas (lo mismo que la API)
    ports:
      - "${QILLQA_PUERTO_WEB:-5173}:5173"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Datos ficticios de demostración: cuentas, directorio, documentos con PDF, tareas, agenda y chat.
  siembra:
    build:
      context: ./backend
      additional_contexts:
        tiqsi: ${PLATAFORMA_DIR:-..}/tiqsi
        rikchay: ${PLATAFORMA_DIR:-..}/rikchay
        wayra: ${PLATAFORMA_DIR:-..}/wayra
        ruray: ${PLATAFORMA_DIR:-..}/ruray
        tullpu: ${PLATAFORMA_DIR:-..}/tullpu
        kuyuy: ${PLATAFORMA_DIR:-..}/kuyuy
        awana: ${PLATAFORMA_DIR:-..}/awana
        qhawana: ${PLATAFORMA_DIR:-..}/qhawana
        yupay: ${PLATAFORMA_DIR:-..}/yupay
        minka: ${PLATAFORMA_DIR:-..}/minka
        rimay: ${PLATAFORMA_DIR:-..}/rimay
        punku: ${PLATAFORMA_DIR:-..}/punku
        qillqasqa: ${PLATAFORMA_DIR:-..}/qillqasqa
    profiles: ["demo"]
    environment:
      QILLQA_API: http://api:8000
      ADMIN_USUARIO: ${ADMIN_USUARIO:-admin}
      ADMIN_CLAVE: ${ADMIN_CLAVE:-}
      DEMO_CLAVE: ${DEMO_CLAVE:-qillqa-demo}
    volumes:
      - ./demo:/demo:ro
    command: ["python3", "/demo/sembrar_demo.py"]
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
  datos:
